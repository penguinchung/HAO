<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取件進度查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #e8e3da;
    --surface: #f4f1ea;
    --surface-raised: #faf8f4;
    --ink: #4a463f;
    --ink-soft: #8a8377;
    --line: #d8d1c3;
    --blue: #7d93a0;
    --blue-deep: #5c7280;
    --done: #7f9482;
    --done-bg: #e4e9e2;
    --wip: #b28a63;
    --wip-bg: #ece2d3;
    --err: #b2705f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 55%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
  }
  .app{ width:100%; max-width: 420px; }
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(74,70,63,0.04), 0 12px 28px -18px rgba(74,70,63,0.35);
  }
  .top-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 26px; }
  h1{ font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 21px; margin: 0; letter-spacing: 0.02em; }
  .switch-link{
    background:none; border:none; color: var(--ink-soft);
    font-family: 'Noto Sans TC', sans-serif; font-size: 13px; cursor:pointer;
    padding: 4px 0; border-bottom: 1px solid transparent;
  }
  .switch-link:hover{ color: var(--blue-deep); border-bottom-color: var(--blue-deep); }
  label{ display:block; font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  input[type=text], input[type=password]{
    width:100%; padding: 13px 14px; font-size: 16px;
    font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface-raised); color: var(--ink);
    outline: none; transition: border-color .15s ease;
  }
  input:focus{ border-color: var(--blue); }
  .btn{
    margin-top: 12px; width:100%; padding: 13px; font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif; font-weight: 500;
    border: none; border-radius: 10px; background: var(--blue-deep);
    color: #f4f1ea; cursor:pointer; transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: #4d6270; }
  .btn:active{ transform: scale(0.99); }
  .btn.small{ width:auto; padding: 9px 16px; font-size: 13px; margin-top:0; }
  .result{
    margin-top: 22px; padding: 20px; border-radius: 12px;
    background: var(--surface-raised); border: 1px solid var(--line); display:none;
  }
  .result.show{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .result .num{ font-family: 'Noto Serif TC', serif; font-size: 18px; margin-bottom: 14px; }
  .status-row{ display:flex; align-items:center; gap: 10px; }
  .dot{ width: 9px; height:9px; border-radius: 50%; flex-shrink:0; }
  .dot.wip{ background: var(--wip); }
  .dot.done{ background: var(--done); }
  .status-text{ font-size: 15px; font-weight: 500; }
  .status-text.wip{ color: var(--wip); }
  .status-text.done{ color: var(--done); }
  .meta{ margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .not-found{
    margin-top: 22px; padding: 18px 20px; border-radius: 12px;
    background: var(--surface-raised); border: 1px dashed var(--line);
    color: var(--ink-soft); font-size: 14px; display:none;
  }
  .not-found.show{ display:block; }
  .staff-add{ display:flex; gap: 8px; margin-bottom: 20px; }
  .staff-add input:nth-child(1){ flex:1.3; }
  .staff-add input:nth-child(2){ flex:0.8; }
  .list{ display:flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y:auto; }
  .item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 13px 14px; background: var(--surface-raised);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .item-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .item-num{ font-family:'Noto Serif TC', serif; font-size:15px; flex-shrink:0; }
  .pill{ font-size: 12px; padding: 3px 10px; border-radius: 999px; flex-shrink:0; }
  .pill.wip{ background: var(--wip-bg); color: var(--wip); }
  .pill.done{ background: var(--done-bg); color: var(--done); }
  .item-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:none; background:none; cursor:pointer; color: var(--ink-soft);
    font-size: 13px; padding: 6px 8px; border-radius: 8px;
  }
  .icon-btn:hover{ background: var(--line); color: var(--ink); }
  .empty{ text-align:center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 18px; text-align:center; }
  .hint.err{ color: var(--err); }
  .pin-error{ font-size: 13px; color: var(--err); margin-top: 10px; display:none; }
  .pin-error.show{ display:block; }
</style>
</head>
<body>
<div class="app">
  <div class="card">

    <!-- customer view -->
    <div id="customerView">
      <div class="top-row">
        <h1>取件進度查詢</h1>
        <button class="switch-link" onclick="showStaffLogin()">店家後台</button>
      </div>
      <label for="queryInput">請輸入您的單號</label>
      <input type="text" id="queryInput" placeholder="例如 A1023" autocomplete="off">
      <label for="queryPhone3" style="margin-top:14px;">手機末三碼</label>
      <input type="text" id="queryPhone3" placeholder="例如 888" maxlength="3" inputmode="numeric" autocomplete="off">
      <button class="btn" onclick="queryOrder()">查詢進度</button>

      <div class="result" id="resultBox">
        <div class="num" id="resultNum"></div>
        <div class="status-row">
          <div class="dot" id="resultDot"></div>
          <div class="status-text" id="resultText"></div>
        </div>
        <div class="meta" id="resultMeta"></div>
      </div>
      <div class="not-found" id="notFoundBox">查無資料,請確認單號與手機末三碼是否正確。</div>
    </div>

    <!-- staff PIN gate -->
    <div id="staffLogin" style="display:none;">
      <div class="top-row">
        <h1>店家後台</h1>
        <button class="switch-link" onclick="showCustomer()">返回查詢頁</button>
      </div>
      <label for="pinInput">請輸入 PIN 碼</label>
      <input type="password" id="pinInput" maxlength="6" inputmode="numeric" autocomplete="off">
      <button class="btn" onclick="checkPin()">進入</button>
      <div class="pin-error" id="pinError">PIN 碼錯誤,請再試一次</div>
    </div>

    <!-- staff view -->
    <div id="staffView" style="display:none;">
      <div class="top-row">
        <h1>店家後台</h1>
        <button class="switch-link" onclick="showCustomer()">返回查詢頁</button>
      </div>
      <div class="staff-add">
        <input type="text" id="newOrderInput" placeholder="單號">
        <input type="text" id="newPhone3Input" placeholder="末三碼" maxlength="3" inputmode="numeric">
        <button class="btn small" onclick="addOrder()">新增</button>
      </div>
      <div class="list" id="orderList"></div>
      <div class="hint" id="syncHint">即時同步中</div>
    </div>

  </div>
</div>

<script>
// ====== 這裡可以自行修改店家後台的 PIN 碼 ======
const STAFF_PIN = '1234';
// ================================================

const firebaseConfig = {
  apiKey: "AIzaSyDTS2F-uZH7TeBFj1baB3hjCA3Z_3BQLm4",
  authDomain: "test-daca6.firebaseapp.com",
  projectId: "test-daca6",
  storageBucket: "test-daca6.firebasestorage.app",
  messagingSenderId: "171812182950",
  appId: "1:171812182950:web:787b5a553b8e1214cacd67"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'order_status'; // 獨立 collection,不會跟其他系統互相干擾

let ordersCache = {};
let customerUnsub = null;
let staffUnsub = null;

function formatTime(ts){
  if(!ts) return '剛剛';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function showStaffLogin(){
  document.getElementById('customerView').style.display = 'none';
  document.getElementById('staffLogin').style.display = 'block';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').classList.remove('show');
}

function checkPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(val === STAFF_PIN){
    document.getElementById('staffLogin').style.display = 'none';
    document.getElementById('staffView').style.display = 'block';
    startStaffListener();
  } else {
    document.getElementById('pinError').classList.add('show');
  }
}

function showCustomer(){
  document.getElementById('staffLogin').style.display = 'none';
  document.getElementById('staffView').style.display = 'none';
  document.getElementById('customerView').style.display = 'block';
  if(staffUnsub){ staffUnsub(); staffUnsub = null; }
}

async function queryOrder(){
  const num = document.getElementById('queryInput').value.trim();
  const phone3 = document.getElementById('queryPhone3').value.trim();
  const resultBox = document.getElementById('resultBox');
  const notFoundBox = document.getElementById('notFoundBox');
  resultBox.classList.remove('show');
  notFoundBox.classList.remove('show');
  if(customerUnsub){ customerUnsub(); customerUnsub = null; }
  if(!num || !phone3) return;

  try{
    const docRef = db.collection(COLLECTION).doc(num);
    const snap = await docRef.get();
    if(!snap.exists || snap.data().phone3 !== phone3){
      notFoundBox.classList.add('show');
      return;
    }
    renderCustomerResult(num, snap.data());
    resultBox.classList.add('show');
    // 之後即時監聽,狀態一改就自動更新畫面,不用重新查詢
    customerUnsub = docRef.onSnapshot(s => {
      if(s.exists) renderCustomerResult(num, s.data());
    });
  }catch(e){
    notFoundBox.textContent = '查詢時發生問題,請確認網路連線後再試一次。';
    notFoundBox.classList.add('show');
  }
}

function renderCustomerResult(num, data){
  document.getElementById('resultNum').textContent = '單號 ' + num;
  const dot = document.getElementById('resultDot');
  const text = document.getElementById('resultText');
  if(data.status === 'done'){
    dot.className = 'dot done';
    text.className = 'status-text done';
    text.textContent = '已完成,歡迎取件';
  } else {
    dot.className = 'dot wip';
    text.className = 'status-text wip';
    text.textContent = '施作中';
  }
  document.getElementById('resultMeta').textContent = '更新時間 ' + formatTime(data.updatedAt);
}

async function addOrder(){
  const input = document.getElementById('newOrderInput');
  const phoneInput = document.getElementById('newPhone3Input');
  const num = input.value.trim();
  const phone3 = phoneInput.value.trim();
  if(!num || !phone3) return;
  input.value = '';
  phoneInput.value = '';
  try{
    await db.collection(COLLECTION).doc(num).set({
      status: 'wip',
      phone3: phone3,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    showSyncError();
  }
}

async function toggleStatus(num){
  const o = ordersCache[num];
  if(!o) return;
  try{
    await db.collection(COLLECTION).doc(num).update({
      status: o.status === 'done' ? 'wip' : 'done',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    showSyncError();
  }
}

async function removeOrder(num){
  try{
    await db.collection(COLLECTION).doc(num).delete();
  }catch(e){
    showSyncError();
  }
}

function showSyncError(){
  const hint = document.getElementById('syncHint');
  hint.textContent = '⚠ 網路連線異常,請確認連線後再試一次';
  hint.classList.add('err');
  setTimeout(() => {
    hint.textContent = '即時同步中';
    hint.classList.remove('err');
  }, 3500);
}

function startStaffListener(){
  if(staffUnsub) staffUnsub();
  staffUnsub = db.collection(COLLECTION).orderBy('updatedAt', 'desc')
    .onSnapshot(snapshot => {
      ordersCache = {};
      snapshot.forEach(doc => { ordersCache[doc.id] = doc.data(); });
      renderStaffList();
    }, err => {
      showSyncError();
    });
}

function renderStaffList(){
  const list = document.getElementById('orderList');
  const keys = Object.keys(ordersCache);
  if(keys.length === 0){
    list.innerHTML = '<div class="empty">目前沒有任何單號</div>';
    return;
  }
  list.innerHTML = keys.map(num => {
    const o = ordersCache[num];
    const isDone = o.status === 'done';
    return `
      <div class="item">
        <div class="item-left">
          <span class="item-num">${num}</span>
          <span class="pill ${isDone ? 'done' : 'wip'}">${isDone ? '已完成' : '施作中'}</span>
        </div>
        <div class="item-actions">
          <button class="icon-btn" onclick="toggleStatus('${num}')">${isDone ? '恢復施作中' : '標記完成'}</button>
          <button class="icon-btn" onclick="removeOrder('${num}')">刪除</button>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('queryInput').addEventListener('keydown', e => { if(e.key === 'Enter') queryOrder(); });
document.getElementById('queryPhone3').addEventListener('keydown', e => { if(e.key === 'Enter') queryOrder(); });
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key === 'Enter') checkPin(); });
document.getElementById('newOrderInput').addEventListener('keydown', e => { if(e.key === 'Enter') addOrder(); });
document.getElementById('newPhone3Input').addEventListener('keydown', e => { if(e.key === 'Enter') addOrder(); });
</script>
</body>
</html>
